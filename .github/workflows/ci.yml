name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The bundles in plugin/ are committed (cloud sessions start them without installing anything,
      # docs/spike.md), so they must match the sources.
      - run: pnpm build
      - name: Bundles are up to date
        run: |
          if ! git diff --exit-code -- plugin/; then
            echo "::error::plugin/ bundles are stale. Run pnpm build and commit them."
            exit 1
          fi
      - run: pnpm test
      - name: Versions agree
        run: node scripts/sync-version.mjs --check
      - run: pnpm run lint:publish
